<!doctype html>
<html lang="id">
  <head>

    <main class="page">

        <p class="eyebrow">di _Jeda_ dulu aja</p>

        <button id="promoButton" class="cta-button">
          Lihat promo hari ini

      <section class="products" aria-label="Produk unggulan">

          <h2>Kopi Tubruk Signature</h2>
          <p>Rasa klasik, aroma kuat, dan cocok untuk pagi yang pelan.</p>
          <span>Rp18.000</span>

        <article class="product-card">
          <h2>Cold Brew Aren</h2>
          <p>Segar, ringan, dan manisnya pas untuk cuaca panas.</p>
          <span>Rp22.000</span>
